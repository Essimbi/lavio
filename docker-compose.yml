# Base PostgreSQL locale pour le développement et les tests (données fictives uniquement).
services:
  postgres:
    image: postgres:17
    container_name: lavio-postgres
    environment:
      POSTGRES_USER: lavio
      POSTGRES_PASSWORD: lavio_local_only
      POSTGRES_DB: lavio
    ports:
      - '54329:5432'
    volumes:
      - lavio-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lavio -d lavio']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  lavio-pgdata:
